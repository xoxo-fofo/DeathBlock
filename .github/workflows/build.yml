name: Build DeathBlock APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          mkdir -p build_src
          unzip -q DeathBlock.zip -d build_src
          ls build_src/DeathBlock

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: build_src/DeathBlock
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: DeathBlock-apk
          path: build_src/DeathBlock/app/build/outputs/apk/debug/*.apk
